# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "30aeb47a869ac5ff3e756173dfd12f17"
name = "PDF Invoice Gen"
application_url = "https://pdf-invoice-gen.vercel.app/"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/paid"
  topics = [ "orders/paid" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/refunds/create"
  topics = [ "refunds/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,read_customers,write_products,write_files,read_content,write_content"

[auth]
redirect_urls = [ "https://pdf-invoice-gen.vercel.app/api/auth/callback" ]

[app_proxy]
url = "https://pdf-invoice-gen.vercel.app/api/storefront"
subpath = "pdf-invoice"
prefix = "apps"
